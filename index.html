<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f6f1e7;
  --panel: #fffdf7;
  --text: #3a3226;
  --sub: #8a7e6b;
  --line: #e4dccb;
  --accent: #e9967a;
  --accent-text: #ffffff;
  --chip: #f1eadb;
  --chip-on: #3a3226;
  --chip-on-text: #fffdf7;
  --danger: #c0564a;
  --c0: #fff0a8; --c1: #ffddb8; --c2: #ffd5df; --c3: #e4d9f7; --c4: #d3e5f7; --c5: #d4ecd0; --c6: #e6e2d8;
  --cat-line: #3a3226; --cat-body: #f0b27a; --cat-pink: #f4a9a8; --cat-eye: #3a3226; --cat-nose: #e07a7a;
  --head: 'DotGothic16', 'M PLUS Rounded 1c', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1d1b19;
    --panel: #272421;
    --text: #ece5d8;
    --sub: #9b917f;
    --line: #3a3631;
    --accent: #d98a72;
    --accent-text: #1d1b19;
    --chip: #34302b;
    --chip-on: #ece5d8;
    --chip-on-text: #1d1b19;
    --danger: #e07b6e;
    --c0: #5a5230; --c1: #5c4328; --c2: #5a3340; --c3: #46395e; --c4: #33495e; --c5: #34503a; --c6: #433f38;
    --cat-line: #ece5d8; --cat-body: #c98d5a; --cat-pink: #c98080; --cat-eye: #1d1b19; --cat-nose: #e08a8a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: 'M PLUS Rounded 1c', 'BIZ UDPGothic', sans-serif;
  padding: max(12px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom));
}
.wrap { max-width: 560px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 12px; margin: 4px 0 14px; }
#cat { width: 64px; height: 56px; image-rendering: pixelated; flex: none; cursor: pointer; }
.bubble {
  position: relative; background: var(--panel); border: 2px solid var(--line);
  border-radius: 14px; padding: 8px 12px; font-family: var(--head); font-size: 14px; line-height: 1.5;
}
.bubble::before {
  content: ''; position: absolute; left: -9px; top: 16px; width: 12px; height: 12px;
  background: var(--panel); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line);
  transform: rotate(45deg);
}
.card { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 12px; margin-bottom: 14px; }
.label { font-size: 12px; color: var(--sub); margin: 12px 0 6px; }
.label:first-child { margin-top: 0; }
input[type=text], input[type=datetime-local], input[type=date], textarea {
  width: 100%; font: inherit; font-size: 16px; color: var(--text); background: var(--bg);
  border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; outline: none;
}
textarea { min-height: 96px; resize: vertical; font-size: 16px; }
input:focus, textarea:focus { border-color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  font: inherit; font-size: 13px; color: var(--text); background: var(--chip);
  border: 2px solid transparent; border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.chip.on { background: var(--chip-on); color: var(--chip-on-text); }
.chip:disabled { opacity: .35; cursor: default; }
.chip.plain { background: transparent; border-color: var(--line); }
.chip.plain.on { background: var(--chip-on); border-color: var(--chip-on); }
.pick { margin-top: 8px; }
.kinds { display: flex; gap: 8px; margin-bottom: 8px; }
.chip.kind { font-size: 20px; line-height: 1.2; padding: 4px 16px; }
[hidden] { display: none !important; }
.names { margin-bottom: 8px; }
.chip.drag { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: grab; }
.pcap { font-size: 11px; color: var(--sub); margin: 8px 0 4px; }
.zone { border: 2px dashed var(--line); border-radius: 14px; padding: 8px 10px; margin-top: 10px; transition: background .15s, border-color .15s; }
.zone.over { border-color: var(--accent); background: rgba(233,150,122,.14); }
.zt { font-family: var(--head); font-size: 13px; margin-bottom: 6px; }
.zbody { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-height: 32px; }
.zempty { font-size: 12px; color: var(--sub); }
.ghost { position: fixed; z-index: 100; pointer-events: none; transform: translate(-50%, -50%) scale(1.06); opacity: .92; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
.pickrow { display: flex; gap: 8px; align-items: center; }
.pickrow input { flex: 1; }
.picked { font-size: 13px; color: var(--sub); margin-top: 10px; min-height: 18px; line-height: 1.5; }
.picked.bad { color: var(--danger); }
.sw { display: flex; gap: 8px; flex-wrap: wrap; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); cursor: pointer; padding: 0; }
.swatch.on { border-color: var(--text); }
.add-btn {
  width: 100%; margin-top: 14px; font-family: var(--head); font-size: 17px;
  background: var(--accent); color: var(--accent-text); border: none; border-radius: 14px; padding: 12px; cursor: pointer;
}
.add-btn:disabled { opacity: .45; }
details.card summary { font-family: var(--head); font-size: 14px; cursor: pointer; }
details.card .hint { font-size: 12px; color: var(--sub); line-height: 1.6; margin: 8px 0; }
details.card code { background: var(--chip); border-radius: 6px; padding: 1px 5px; font-size: 12px; }
.tabs { display: flex; gap: 8px; margin: 0 2px 6px; }
.tab { font-family: var(--head); font-size: 15px; color: var(--sub); background: none; border: none; padding: 6px 4px; cursor: pointer; border-bottom: 3px solid transparent; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.sec { font-family: var(--head); font-size: 13px; color: var(--sub); margin: 14px 2px 8px; }
.note { border-radius: 6px 6px 14px 6px; padding: 12px 12px 10px; margin-bottom: 10px; color: var(--text); box-shadow: 0 2px 0 rgba(0,0,0,.08); }
.note.c0 { background: var(--c0); } .note.c1 { background: var(--c1); } .note.c2 { background: var(--c2); }
.note.c3 { background: var(--c3); } .note.c4 { background: var(--c4); } .note.c5 { background: var(--c5); } .note.c6 { background: var(--c6); }
.note.done { opacity: .6; }
.note-row { display: flex; gap: 10px; align-items: flex-start; }
.check {
  flex: none; width: 26px; height: 26px; border: 2px solid var(--text); border-radius: 8px;
  background: transparent; cursor: pointer; display: grid; place-items: center; font-size: 16px; color: var(--text); padding: 0;
}
.title { flex: 1; font-size: 16px; line-height: 1.45; word-break: break-word; }
.done .title { text-decoration: line-through; }
.meta { display: flex; align-items: center; gap: 4px 10px; margin-top: 8px; font-size: 12px; flex-wrap: wrap; }
.when, .dl { font-weight: 700; }
.when.over, .dl.over { color: var(--danger); }
.spacer { flex: 1; }
.mini { font: inherit; font-size: 12px; color: var(--text); background: rgba(255,255,255,.35); border: none; border-radius: 999px; padding: 4px 10px; cursor: pointer; }
@media (prefers-color-scheme: dark) { .mini { background: rgba(255,255,255,.12); } }
.sbox { margin-top: 8px; padding-top: 8px; border-top: 1px dashed rgba(0,0,0,.2); display: none; }
@media (prefers-color-scheme: dark) { .sbox { border-top-color: rgba(255,255,255,.2); } }
.sbox.open { display: block; }
.empty { text-align: center; color: var(--sub); font-size: 14px; padding: 24px 0; }
.cand { border: 2px dashed var(--line); border-radius: 14px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel); }
.cand .ct { font-size: 15px; line-height: 1.45; word-break: break-word; }
.cand .cm { font-size: 12px; color: var(--sub); margin-top: 4px; line-height: 1.5; }
.cand .cm.bad { color: var(--danger); }
.cand .cb { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.urlbox { margin: 24px 0 8px; padding: 10px 12px; border: 2px dashed var(--line); border-radius: 14px; background: var(--panel); font-size: 12px; color: var(--sub); line-height: 1.5; }
.urlbox .ut { margin-bottom: 6px; }
.urlbox .uv { display: block; width: 100%; box-sizing: border-box; font-size: 16px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); font-family: inherit; }
.urlbox button { margin-top: 6px; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--chip-on); color: var(--chip-on-text); padding: 10px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90%; text-align: center; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <canvas id="cat" width="16" height="14" title="なでる"></canvas>
    <div class="bubble" id="bubble">読み込み中…</div>
  </header>

  <section class="card">
    <div class="label" id="titleLabel">なにをやる？</div>
    <div class="kinds" id="kinds"></div>
    <div class="chips names" id="names" hidden></div>
    <input type="text" id="title" placeholder="例：書類を確認する" maxlength="200" autocomplete="off">
    <div class="label">締め切り（なくてもOK）</div>
    <div class="chips" id="dlChips"></div>
    <div class="pick" id="dlPick" hidden><input type="date" id="dlInput"></div>
    <div class="label">通知の選択肢<br>ドラッグ（スマホは長押ししてドラッグ）か、タップで下の枠に入ります</div>
    <div id="pool"></div>
    <div class="pick pickrow" id="whenPick" hidden><input type="datetime-local" id="whenInput"><button class="chip on" id="whenOk">決定</button></div>
    <div class="zone" id="zMain" data-zone="main"><div class="zt">① 一番重要な通知</div><div class="zbody" id="zMainBody"></div></div>
    <div class="zone" id="zPre" data-zone="pre"><div class="zt">② それより前の事前の通知</div><div class="zbody" id="zPreBody"></div></div>
    <div class="picked" id="picked"></div>
    <div class="label">付箋の色</div>
    <div class="sw" id="colorSw"></div>
    <button class="add-btn" id="addBtn" disabled>ぺたっと貼る</button>
  </section>

  <div id="cands"></div>
  <details class="card" id="pasteBox">
    <summary>🐱 メールパトロールの候補を貼る</summary>
    <div class="hint">1行に1件、<code>やること｜通知｜締切｜ひとこと</code> の形で貼ってください。通知・締切・ひとことは省略できます。通知は <code>10/21 9:00</code>、<code>明日</code>、<code>来週月曜</code>、<code>今日中</code> などで書けます。</div>
    <textarea id="candText" placeholder="例：県へ返信｜10/21 9:00｜10/25&#10;書類の確認｜今日中"></textarea>
    <button class="add-btn" id="candBtn" style="margin-top:10px">候補にする</button>
  </details>

  <div class="tabs">
    <button class="tab on" id="tabTodo">やること</button>
    <button class="tab" id="tabDone">できたこと</button>
  </div>
  <div id="list"></div>
  <div class="urlbox" id="urlbox" hidden>
    <div class="ut">📱 スマホで開くときは、このURLをコピーして Safari に貼ってね</div>
    <input class="uv" id="appUrl" type="text" readonly>
    <button class="chip" id="copyUrl">コピー</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ===== 設定（ここを書き換えると時間帯のボタンが変わります） =====
const TIMES = { afternoon: 15, evening: 17, morning: 9 };
const REL_OPTIONS = [
  { label: '10分前', min: 10 },
  { label: '1時間前', min: 60 },
  { label: '前日', min: 1440 },
  { label: '3日前', min: 4320 },
  { label: '1週間前', min: 10080 }
];
const COLOR_NAMES = ['きいろ', 'オレンジ', 'ピンク', 'むらさき', 'あお', 'みどり', 'ベージュ'];

// ===== 開発確認用の仮バックエンド（本番のGASでは使われません） =====
if (typeof google === 'undefined') {
  const mem = [];
  let seq = 1;
  const api = {
    listNotes: () => mem.slice(),
    addNote: (t, s, r, d, c) => { const n = { id: 'm' + seq++, title: t, start: s, done: false, doneAt: null, rem: r, deadline: d || null, color: c || 0 }; mem.push(n); return n; },
    setDone: (id, d) => { const n = mem.find(x => x.id === id); n.done = d; n.doneAt = d ? Date.now() : null; return n; },
    snoozeNote: (id, s) => { const n = mem.find(x => x.id === id); n.start = s; n.done = false; n.doneAt = null; return n; },
    setColor: (id, c) => { const n = mem.find(x => x.id === id); n.color = c; return n; },
    getAppUrl: () => 'https://script.google.com/macros/s/（ここに本物のURLが出ます）/exec',
    deleteNote: (id) => { mem.splice(mem.findIndex(x => x.id === id), 1); return true; }
  };
  const builder = (ok, ng) => new Proxy({}, { get: (_, k) => {
    if (k === 'withSuccessHandler') return f => builder(f, ng);
    if (k === 'withFailureHandler') return f => builder(ok, f);
    return (...a) => setTimeout(() => { try { const r = api[k](...a); ok && ok(r); } catch (e) { ng && ng(e); } }, 80);
  } });
  window.google = { script: { run: builder(null, null) } };
  const now = Date.now(), H = 3600e3, D = 86400e3;
  const eod = off => { const d = new Date(); d.setDate(d.getDate() + off); d.setHours(23, 59, 0, 0); return d.getTime(); };
  mem.push({ id: 'm0', title: '〇〇の報告書を確認する', start: now + H * 3, done: false, doneAt: null, rem: [0], deadline: eod(0), color: 0 });
  mem.push({ id: 'm00', title: '来月の会議資料をまとめる', start: now + D * 20, done: false, doneAt: null, rem: [0, 1440], deadline: eod(27), color: 5 });
  mem.push({ id: 'm000', title: '返信の催促メールを送る', start: now - H * 5, done: false, doneAt: null, rem: [0], deadline: null, color: 2 });
  mem.push({ id: 'm0000', title: '郵便物を出す', start: now - D, done: true, doneAt: now - H, rem: [0], deadline: null, color: 4 });
  mem.push({ id: 'm00000', title: '〇〇さんに☏', start: now + D * 2, done: false, doneAt: null, rem: [0], deadline: null, color: 3 });
  seq = 6;
}

const $ = id => document.getElementById(id);
const WD = ['日', '月', '火', '水', '木', '金', '土'];
function p2(n) { return String(n).padStart(2, '0'); }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }

// ===== ドット絵の猫 =====
const CAT = [
  '................',
  '.##..........##.',
  '.#p#........#p#.',
  '.#pp########pp#.',
  '.#@@@@@@@@@@@@#.',
  '.#@@@@@@@@@@@@#.',
  '.#@@ee@@@@ee@@#.',
  '.#@@ee@@@@ee@@#.',
  '.#@@@@@nn@@@@@#.',
  '.#@@@@@@@@@@@@#.',
  '..#@@@@@@@@@@#..',
  '...##########...'
];
const CAT_HAPPY = CAT.slice();
CAT_HAPPY[6] = '.#@@@@@@@@@@@@#.';
CAT_HAPPY[7] = '.#@@ee@@@@ee@@#.';
const catCv = $('cat');
function css(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function drawCat(rows) {
  const c = catCv.getContext('2d');
  c.clearRect(0, 0, 16, 14);
  const map = { '#': css('--cat-line'), '@': css('--cat-body'), 'p': css('--cat-pink'), 'e': css('--cat-eye'), 'n': css('--cat-nose') };
  rows.forEach((row, y) => {
    for (let x = 0; x < row.length; x++) {
      const col = map[row[x]];
      if (col) { c.fillStyle = col; c.fillRect(x, y + 1, 1, 1); }
    }
  });
}
let catHappy = false;
function renderCat() { drawCat(catHappy ? CAT_HAPPY : CAT); }
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderCat);
catCv.addEventListener('click', () => {
  catHappy = true; renderCat(); say('ごろごろ…');
  setTimeout(() => { catHappy = false; renderCat(); refreshBubble(); }, 1400);
});

// ===== 日時ヘルパー =====
function at(off, h, m) { const d = new Date(); d.setDate(d.getDate() + off); d.setHours(h, m || 0, 0, 0); return d.getTime(); }
function nextMonday(h, m) { const d = new Date(); const diff = ((1 - d.getDay() + 7) % 7) || 7; return at(diff, h, m); }
function nextMonth1st(h) { const d = new Date(); return new Date(d.getFullYear(), d.getMonth() + 1, 1, h, 0, 0, 0).getTime(); }
function fmtDate(ms) { const d = new Date(ms); return (d.getMonth() + 1) + '/' + d.getDate() + '(' + WD[d.getDay()] + ')'; }
function fmt(ms) { const d = new Date(ms); return fmtDate(ms) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function fmtDl(ms) { const d = new Date(ms); return (d.getHours() === 23 && d.getMinutes() === 59) ? fmtDate(ms) : fmt(ms); }
function sameDay(a, b) { return new Date(a).toDateString() === new Date(b).toDateString(); }
function toLocalInput(ms) { const d = new Date(ms); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + 'T' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }
function toDateInput(ms) { const d = new Date(ms); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); }

// 「今日中」の通知時刻：朝9時前なら9時、夕方17時前なら17時、それ以降はなし
function todayRule() {
  const n = Date.now();
  if (n < at(0, TIMES.morning)) return at(0, TIMES.morning);
  if (n < at(0, TIMES.evening)) return at(0, TIMES.evening);
  return null;
}
function presets() {
  return [
    { label: '1時間後', ms: Date.now() + 3600e3 },
    { label: '今日中', ms: todayRule(), today: true },
    { label: '今日の午後', ms: at(0, TIMES.afternoon) },
    { label: '今日の夕方', ms: at(0, TIMES.evening) },
    { label: '明日の朝', ms: at(1, TIMES.morning) },
    { label: '来週の月曜', ms: nextMonday(TIMES.morning) },
    { label: '来月のはじめ', ms: nextMonth1st(TIMES.morning) }
  ];
}
function dlPresets() {
  return [
    { label: 'なし', ms: null },
    { label: '今日', ms: at(0, 23, 59) },
    { label: '明日', ms: at(1, 23, 59) },
    { label: '来週の月曜', ms: nextMonday(23, 59) }
  ];
}

// ===== 状態 =====
let notes = [];
let tab = 'todo';
let when = null, whenSel = null;
let dl = null, dlSel = 'なし';
let pre = [];
let mainItem = null;
let pickZone = 'main';
let suppressClick = false;
let dragActive = false;
let color = load('fusen_color', 0);
let busy = false;
let cands = load('fusen_cands', []);

function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2400); }
function say(msg) { $('bubble').textContent = msg; }
function fail(e) { busy = false; updateAdd(); toast('うまくいきませんでした：' + (e && e.message ? e.message : e)); }

// ===== 入力欄 =====
function renderDlChips() {
  const box = $('dlChips'); box.innerHTML = '';
  dlPresets().forEach(p => {
    const b = document.createElement('button');
    b.className = 'chip' + (dlSel === p.label ? ' on' : '');
    b.textContent = p.label;
    b.onclick = () => { dl = p.ms; dlSel = p.label; $('dlPick').hidden = true; renderDlChips(); showPicked(); updateAdd(); };
    box.appendChild(b);
  });
  const o = document.createElement('button');
  o.className = 'chip plain' + (dlSel === '日付を選ぶ' ? ' on' : '');
  o.textContent = '日付を選ぶ';
  o.onclick = () => {
    $('dlPick').hidden = false; dlSel = '日付を選ぶ';
    if (!$('dlInput').value) $('dlInput').value = toDateInput(when || at(1, 12));
    dl = new Date($('dlInput').value + 'T23:59:00').getTime();
    renderDlChips(); showPicked(); updateAdd();
  };
  box.appendChild(o);
}
$('dlInput').addEventListener('input', () => {
  const v = $('dlInput').value; dl = v ? new Date(v + 'T23:59:00').getTime() : null;
  showPicked(); updateAdd();
});
function dlBad() { return !!(dl && when && dl < when); }

// 鳴る時刻（①の何分前か）の一覧。①は0分前、事前の通知はそのぶん前
function computeRem() {
  const set = new Set([0]);
  if (when) pre.forEach(it => {
    const m = it.kind === 'rel' ? it.min : Math.round((when - it.ms) / 60000);
    if (m > 0) set.add(m);
  });
  return Array.from(set).sort((a, b) => a - b);
}
function showPicked() {
  const el = $('picked'); let t = '';
  if (when) {

// ----- ドラッグ（マウス：そのままドラッグ／タッチ：長押ししてからドラッグ） -----
document.addEventListener('touchmove', e => { if (dragActive) e.preventDefault(); }, { passive: false });

function makeDraggable(el, item) {
  let timer = null, sx = 0, sy = 0, ghost = null, started = false, ptype = '', pid = null;
  const moveGhost = (x, y) => { ghost.style.left = x + 'px'; ghost.style.top = y + 'px'; };
  const cleanup = () => {
    clearTimeout(timer); timer = null;
    document.removeEventListener('pointermove', onMove); document.removeEventListener('pointerup', onUp); document.removeEventListener('pointercancel', cleanup);
    if (ghost) { ghost.remove(); ghost = null; }
    document.querySelectorAll('.zone.over').forEach(z => z.classList.remove('over'));
    dragActive = false; started = false;
  };
  const begin = (x, y) => {
    started = true; dragActive = true;
    ghost = el.cloneNode(true); ghost.classList.add('ghost'); document.body.appendChild(ghost); moveGhost(x, y);
    try { if (navigator.vibrate) navigator.vibrate(10); } catch (e) {}
  };
  function onMove(e) {
    if (e.pointerId !== pid) return;
    const d = Math.hypot(e.clientX - sx, e.clientY - sy);
    if (!started) {
      if (ptype === 'mouse') { if (d > 5) begin(e.clientX, e.clientY); }
      else if (d > 10) cleanup(); // 長押しの前に動いた＝スクロール
      return;
    }
    moveGhost(e.clientX, e.clientY);
    const z = zoneAt(e.clientX, e.clientY);
    document.querySelectorAll('.zone').forEach(zz => zz.classList.toggle('over', zz === z));
  }
  function onUp(e) {
    if (e.pointerId !== pid) return;
    if (started) {
      const z = zoneAt(e.clientX, e.clientY);
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 80);
      cleanup(); if (z) dropTo(z.dataset.zone, item);
    } else cleanup();
  }

    ptype = e.pointerType; if (ptype === 'mouse' && e.button !== 0) return;
    pid = e.pointerId; sx = e.clientX; sy = e.clientY;
    document.addEventListener('pointermove', onMove); document.addEventListener('pointerup', onUp); document.addEventListener('pointercancel', cleanup);
    if (ptype !== 'mouse') timer = setTimeout(() => begin(sx, sy), 250);
  });
  el.addEventListener('click', () => { if (!suppressClick) tapPlace(item); });
}

// ===== メールパトロールの候補（貼り付け） =====
function parseJa(str) {
  let s = (str || '').trim()
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/／/g, '/').replace(/：/g, ':');
  if (!s || /^(なし|未定|-|ー)$/.test(s)) return null;
  const now = new Date();
  const t0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const add = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const dowIdx = ch => '日月火水木金土'.indexOf(ch);
  let base = null, m;
  const todayWord = /今日中/.test(s);
  if (/今日/.test(s)) base = t0;
  else if (/明後日/.test(s)) base = add(t0, 2);
  else if (/明日/.test(s)) base = add(t0, 1);
  else if ((m = s.match(/来週(?:の)?([日月火水木金土])/))) {
    const nextMon = add(t0, ((1 - t0.getDay() + 7) % 7) || 7);
    base = add(nextMon, (dowIdx(m[1]) + 6) % 7);
  } else if ((m = s.match(/今週(?:の)?([日月火水木金土])/))) {
    const thisMon = add(t0, -((t0.getDay() + 6) % 7));
    base = add(thisMon, (dowIdx(m[1]) + 6) % 7);
  } else if (/来週/.test(s)) base = add(t0, ((1 - t0.getDay() + 7) % 7) || 7);
  else if (/来月/.test(s)) base = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  else if ((m = s.match(/(\d{4})[\/\-年](\d{1,2})[\/\-月](\d{1,2})/))) base = new Date(+m[1], +m[2] - 1, +m[3]);
  else if ((m = s.match(/(\d{1,2})[\/月](\d{1,2})/))) {
    base = new Date(now.getFullYear(), +m[1] - 1, +m[2]);
    // 2か月以上前の日付は「来年のこと」とみなし、最近の過去日付はそのまま（採用時に「過去」と警告）
    if (t0 - base > 60 * 86400e3) base = new Date(now.getFullYear() + 1, +m[1] - 1, +m[2]);
  }
  if (!base) return null;
  let h = null, mi = 0;
  if ((m = s.match(/(\d{1,2}):(\d{2})/))) { h = +m[1]; mi = +m[2]; }
  else if ((m = s.match(/(\d{1,2})時(?:(\d{1,2})分)?/))) { h = +m[1]; mi = m[2] ? +m[2] : 0; }
  return { base, h, m: mi, hasTime: h !== null, todayWord };
}
function toMs(p, dh, dm) {
  const d = new Date(p.base);
  d.setHours(p.hasTime ? p.h : dh, p.hasTime ? p.m : dm, 0, 0);
  return d.getTime();
}
function parseLine(line) {
  let s = line.trim();
  if (!s || s[0] === '#') return null;
  s = s.replace(/^[-*・●○□☐]\s*(\[[ xX]?\]\s*)?/, '');
  const parts = s.split(/[｜|\t]/).map(x => x.trim());
  const title = parts[0];
  if (!title) return null;
  const pn = parseJa(parts[1]), pd = parseJa(parts[2]);
  let w = null, d = null;
  if (pn) { if (pn.todayWord) { w = todayRule(); d = at(0, 23, 59); } else w = toMs(pn, TIMES.morning, 0); }
  if (pd) d = pd.hasTime ? toMs(pd, 0, 0) : toMs(pd, 23, 59);
  return { id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6), title, when: w, dl: d, memo: parts[3] || '' };
}

  const sw = document.createElement('div'); sw.className = 'sw';
  swatchRow(sw, n.color || 0, i => {
    google.script.run.withSuccessHandler(r => { Object.assign(n, r); render(); }).withFailureHandler(fail).setColor(n.id, i);
  });
  cbox.appendChild(sw);

  if (!n.done) {
    const sb = document.createElement('button'); sb.className = 'mini'; sb.textContent = '💤 あとで';
    sb.onclick = () => { cbox.classList.remove('open'); sbox.classList.toggle('open'); };
    meta.appendChild(sb);
    const chips = document.createElement('div'); chips.className = 'chips';
    snoozeOptions().forEach(o => {
      const b = document.createElement('button'); b.className = 'chip'; b.textContent = o.label;
      b.onclick = () => {
        if (o.pick) {
          let inp = sbox.querySelector('input');
          if (!inp) {
            inp = document.createElement('input'); inp.type = 'datetime-local'; inp.value = toLocalInput(at(1, TIMES.morning)); inp.style.marginTop = '8px';
            const go = document.createElement('button'); go.className = 'chip on'; go.textContent = 'この日時に動かす'; go.style.marginTop = '8px';
            go.onclick = () => { const ms = new Date(inp.value).getTime(); if (ms > Date.now()) doSnooze(n, ms); else toast('未来の日時を選んでね'); };
            sbox.appendChild(inp); sbox.appendChild(go);
          }
        } else doSnooze(n, o.ms);
      };
      chips.appendChild(b);
    });
    sbox.appendChild(chips);
  }
  const pal = document.createElement('button'); pal.className = 'mini'; pal.textContent = '🎨';
  pal.setAttribute('aria-label', '色を変える');
  pal.onclick = () => { sbox.classList.remove('open'); cbox.classList.toggle('open'); };
  meta.appendChild(pal);
  const del = document.createElement('button'); del.className = 'mini'; del.textContent = '🗑';
  del.setAttribute('aria-label', '削除');
  del.onclick = () => {
    if (!confirm('この付箋を削除しますか？')) return;
    google.script.run.withSuccessHandler(() => { notes = notes.filter(x => x.id !== n.id); render(); }).withFailureHandler(fail).deleteNote(n.id);
  };
  meta.appendChild(del);
  el.appendChild(meta); el.appendChild(sbox); el.appendChild(cbox);
  return el;
}

function doSnooze(n, ms) {
  google.script.run.withSuccessHandler(r => { Object.assign(n, r); toast(fmt(ms) + ' にずらしました'); render(); }).withFailureHandler(fail).snoozeNote(n.id, ms);
}

// ===== 起動 =====
renderCat(); renderKinds(); renderPool(); renderZones(); renderDlChips(); renderColors(); renderCands(); updateAdd();
google.script.run.withSuccessHandler(list => { notes = list; render(); renderNames(); }).withFailureHandler(fail).listNotes();
google.script.run.withSuccessHandler(u => {
  if (!u) return;
  $('appUrl').value = u; $('urlbox').hidden = false;
}).getAppUrl();
$('appUrl').addEventListener('focus', e => e.target.select());
$('copyUrl').onclick = () => {
  const v = $('appUrl'); v.select();
  const ok = () => toast('URLをコピーしました 🐾');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v.value).then(ok, () => { try { document.execCommand('copy'); ok(); } catch (e) { toast('長押しでコピーしてね'); } });
  else { try { document.execCommand('copy'); ok(); } catch (e) { toast('長押しでコピーしてね'); } }
};
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) google.script.run.withSuccessHandler(list => { notes = list; render(); renderPool(); renderNames(); }).withFailureHandler(fail).listNotes();
});
</script>
</body>
</html>
